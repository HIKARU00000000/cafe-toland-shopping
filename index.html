<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b0908" />
<title>CAFE TOLAND — 買い出しリスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0b0908;
    --bg-2: #110e0b;
    --surface: #16120e;
    --surface-2: #1d1812;
    --border: rgba(201, 169, 97, 0.12);
    --border-strong: rgba(201, 169, 97, 0.25);
    --hairline: rgba(245, 240, 232, 0.06);
    --text: #f5f0e8;
    --text-muted: #a89d8e;
    --text-dim: #6b6358;
    --gold: #c9a961;
    --gold-bright: #e4c680;
    --gold-dim: #8a7340;
    --gold-soft: rgba(201, 169, 97, 0.1);
    --danger: #b85a5a;
    --success: #7fb37f;

    --serif: "Cormorant Garamond", "Noto Serif JP", serif;
    --sans: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    --jp-serif: "Noto Serif JP", "Cormorant Garamond", serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }
  /* 「すべて」表示時、店舗セクションごとにスナップスクロール */
  html.snap-scroll {
    scroll-snap-type: y proximity;
    scroll-padding-top: 24px;
  }
  body {
    min-height: 100vh;
    padding-bottom: 140px;
    background-image:
      radial-gradient(ellipse at top, rgba(201, 169, 97, 0.04), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(201, 169, 97, 0.02), transparent 60%);
  }

  /* ---------- Header ---------- */
  header {
    padding: 56px 24px 20px;
    text-align: center;
    position: relative;
  }
  .brand {
    font-family: var(--serif);
    font-size: 11px;
    letter-spacing: 0.5em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 400;
    margin-bottom: 10px;
  }
  .brand::before, .brand::after {
    content: '';
    display: inline-block;
    width: 24px;
    height: 1px;
    background: var(--gold-dim);
    vertical-align: middle;
    margin: 0 14px;
    opacity: 0.7;
  }
  .wordmark {
    font-family: var(--jp-serif);
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.18em;
    color: var(--text);
    line-height: 1;
    margin-bottom: 14px;
  }
  .date-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-family: var(--serif);
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }
  .date-pill .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }

  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.3 } }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 28px;
  }
  .tab {
    position: relative;
    padding: 6px 0;
    font-family: var(--jp-serif);
    font-size: 14px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color .2s;
  }
  .tab::after {
    content: '';
    position: absolute;
    bottom: -21px;
    left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 100%;
    height: 1px;
    background: var(--gold);
    transition: transform .25s;
  }
  .tab.active { color: var(--gold); }
  .tab.active::after { transform: translateX(-50%) scaleX(1); }
  .tab .count {
    font-family: var(--serif);
    font-size: 11px;
    margin-left: 4px;
    opacity: 0.7;
  }

  /* ---------- Hero / Stats ---------- */
  .hero {
    margin: 0 24px 36px;
    padding: 32px 28px;
    position: relative;
    background:
      linear-gradient(135deg, rgba(201, 169, 97, 0.06), rgba(201, 169, 97, 0.01));
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .hero::before, .hero::after {
    content: '';
    position: absolute;
    width: 24px; height: 24px;
    border: 1px solid var(--gold);
    opacity: 0.4;
  }
  .hero::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .hero::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .hero-label {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.2em;
    margin-bottom: 6px;
  }
  .hero-title {
    font-family: var(--jp-serif);
    font-weight: 500;
    font-size: 26px;
    color: var(--text);
    letter-spacing: 0.08em;
    margin-bottom: 20px;
  }
  .divider {
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin-bottom: 18px;
    opacity: 0.5;
  }
  .stats {
    display: flex;
    gap: 32px;
    align-items: baseline;
  }
  .stat-group { display: flex; flex-direction: column; gap: 2px; }
  .stat-num {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 32px;
    color: var(--text);
    line-height: 1;
  }
  .stat-num .suffix {
    font-size: 14px;
    color: var(--text-muted);
    margin-left: 4px;
    font-style: italic;
  }
  .stat-label {
    font-family: var(--jp-serif);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.2em;
  }
  .stat-sep { width: 1px; height: 36px; background: var(--hairline); }

  /* ---------- Section Header ---------- */
  .section-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 24px 18px;
  }
  .section-head .line { flex: 1; height: 1px; background: var(--hairline); }
  .section-head .label {
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  /* ---------- Saved Memo (ホーム画面に残るメモ) ---------- */
  .saved-memo {
    margin: 0 24px 32px;
    padding: 24px 20px 20px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 2px;
    position: relative;
  }
  .saved-memo::before, .saved-memo::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border: 1px solid var(--gold);
    opacity: 0.5;
  }
  .saved-memo::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
  .saved-memo::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }

  .saved-memo-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .saved-memo-head-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .saved-memo-eyebrow {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
  .saved-memo-time {
    font-family: var(--serif);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .saved-memo-actions { display: flex; gap: 8px; }
  .saved-memo-btn {
    padding: 7px 12px;
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: 2px;
    color: var(--text-muted);
    font-family: var(--jp-serif);
    font-size: 10px;
    letter-spacing: 0.2em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all .2s;
  }
  .saved-memo-btn svg { width: 12px; height: 12px; }
  .saved-memo-btn.copy:active, .saved-memo-btn.copy.copied {
    background: var(--gold);
    color: #0b0908;
    border-color: var(--gold);
  }
  .saved-memo-btn.delete { color: var(--danger); border-color: rgba(184, 90, 90, 0.3); }
  .saved-memo-btn.delete:active { background: rgba(184, 90, 90, 0.1); }

  .saved-memo-text {
    font-family: var(--jp-serif);
    font-weight: 400;
    font-size: 13px;
    line-height: 2;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    letter-spacing: 0.08em;
    max-height: 420px;
    overflow-y: auto;
  }

  /* ---------- Store Chips ---------- */
  .store-chips {
    display: flex;
    gap: 8px;
    padding: 0 20px 24px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .store-chips::-webkit-scrollbar { display: none; }
  .store-chip {
    flex-shrink: 0;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-family: var(--jp-serif);
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .store-chip:active { background: var(--surface); }
  .store-chip.active {
    background: var(--gold);
    color: #0b0908;
    border-color: var(--gold);
    font-weight: 500;
  }
  .store-chip .chip-count {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11px;
    opacity: 0.75;
  }
  .store-chip.manage {
    color: var(--gold);
    border-color: var(--border-strong);
    border-style: dashed;
  }
  .store-chip.manage:active { background: var(--gold-soft); }
  .store-chip.manage.active {
    background: var(--gold);
    color: #0b0908;
    border-color: var(--gold);
    border-style: solid;
    font-weight: 500;
  }
  .store-chip svg { width: 14px; height: 14px; }

  /* 編集モード時の見た目 */
  .edit-mode-banner {
    display: none;
    margin: 0 20px 16px;
    padding: 10px 16px;
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    border-radius: 2px;
    font-family: var(--jp-serif);
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-align: center;
  }
  body.editing .edit-mode-banner { display: block; }
  body.editing .item {
    cursor: pointer;
    border-color: var(--gold-dim);
  }
  body.editing .item::after {
    content: '✎';
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 16px;
    opacity: 0.8;
  }
  body.editing .item .checkbox,
  body.editing .item .qty-stepper {
    pointer-events: none;
    opacity: 0.35;
  }

  /* ---------- Store Group ---------- */
  .store-group {
    min-height: calc(100vh - 160px);
    padding-top: 8px;
    padding-bottom: 24px;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
  }
  .store-group:last-child { min-height: 0; }
  .store-group-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px 18px;
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(to bottom, var(--bg) 70%, rgba(11, 9, 8, 0.9));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .store-group-head .line { flex: 1; height: 1px; background: var(--gold-dim); opacity: 0.4; }
  .store-group-head .name {
    font-family: var(--jp-serif);
    font-weight: 500;
    font-size: 17px;
    color: var(--gold);
    letter-spacing: 0.22em;
  }
  .store-group-head .count {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--text-muted);
    margin-left: 2px;
  }

  /* ---------- Item ---------- */
  .items { padding: 0 16px; }
  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    margin-bottom: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
    transition: all .25s;
    position: relative;
    overflow: hidden;
  }
  .item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--gold);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform .25s;
  }
  .item:active { transform: scale(0.99); }
  .item.checked::before { transform: scaleY(1); }
  .item.checked { background: var(--bg-2); border-color: var(--border); }
  .item.checked .item-name {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--gold-dim);
  }
  .item.checked .thumb { opacity: 0.4; }

  .checkbox {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all .25s;
  }
  .item.checked .checkbox {
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(201, 169, 97, 0.4);
  }
  .checkbox svg { width: 12px; height: 12px; opacity: 0; transition: opacity .2s; }
  .item.checked .checkbox svg { opacity: 1; }

  .thumb {
    width: 58px; height: 58px;
    border-radius: 2px;
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    transition: opacity .25s;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .placeholder { color: var(--gold-dim); opacity: 0.5; }
  .thumb .placeholder svg { width: 24px; height: 24px; }

  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-family: var(--jp-serif);
    font-weight: 500;
    font-size: 16px;
    color: var(--text);
    letter-spacing: 0.04em;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item-meta {
    font-family: var(--sans);
    font-weight: 300;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .item-menu {
    width: 34px; height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 2px;
    cursor: pointer;
    transition: all .2s;
  }
  .item-menu:active { color: var(--gold); border-color: var(--border); }
  .item-menu svg { width: 16px; height: 16px; }

  /* Qty Stepper (item card inline) — チェック時のみ表示 */
  .qty-stepper {
    display: none;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    border: 1px solid var(--gold-dim);
    border-radius: 999px;
    padding: 3px;
    background: var(--bg-2);
  }
  .item.checked .qty-stepper { display: flex; }
  .qty-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--gold);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 22px;
    font-weight: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    transition: all .15s;
  }
  .qty-btn:active {
    background: var(--gold);
    color: #0b0908;
    border-color: var(--gold);
  }
  .qty-btn:disabled { color: var(--text-dim); cursor: not-allowed; border-color: var(--hairline); }
  .qty-btn:disabled:active { background: var(--surface); color: var(--text-dim); border-color: var(--hairline); }
  .qty-num {
    min-width: 32px;
    text-align: center;
    font-family: var(--serif);
    font-weight: 500;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 0.03em;
    line-height: 1;
  }
  .item.checked .qty-num { color: var(--gold); }

  /* Qty in add/edit modal */
  .qty-modal {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: var(--surface);
  }
  .qty-modal .qty-btn {
    width: 34px;
    height: 34px;
    font-size: 20px;
  }
  .qty-modal .qty-num {
    min-width: 34px;
    font-size: 18px;
  }

  /* ---------- Empty / Loading ---------- */
  .empty {
    margin: 20px 24px;
    padding: 56px 32px;
    text-align: center;
    border: 1px dashed var(--border-strong);
    border-radius: 2px;
    background: rgba(201, 169, 97, 0.015);
  }
  .empty-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px; height: 56px;
    border: 1px solid var(--gold-dim);
    border-radius: 50%;
    margin-bottom: 20px;
    color: var(--gold);
  }
  .empty-icon svg { width: 24px; height: 24px; }
  .empty-title {
    font-family: var(--jp-serif);
    font-weight: 500;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .empty-ornament {
    font-family: var(--serif);
    font-style: italic;
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 0.3em;
    margin: 14px 0;
    opacity: 0.6;
  }
  .empty-sub {
    font-family: var(--jp-serif);
    font-weight: 300;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 2;
    letter-spacing: 0.1em;
  }

  .loader {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
    color: var(--gold);
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.3em;
    gap: 10px;
  }
  .loader .spinner {
    width: 14px; height: 14px;
    border: 1px solid var(--gold-dim);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* カテゴリー末尾の商品追加ボタン */
  .add-item-btn {
    margin: 10px 16px 4px;
    padding: 14px 20px;
    background: transparent;
    border: 1px dashed var(--border-strong);
    border-radius: 2px;
    color: var(--gold);
    font-family: var(--jp-serif);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.2em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: calc(100% - 32px);
    transition: all .2s;
  }
  .add-item-btn:active {
    background: var(--gold-soft);
    border-color: var(--gold);
    border-style: solid;
  }
  .add-item-btn svg { width: 14px; height: 14px; }

  /* ---------- Bottom Bar ---------- */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, rgba(11, 9, 8, 0.8) 85%, transparent);
    display: flex;
    gap: 10px;
    z-index: 20;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .btn {
    padding: 16px 20px;
    border-radius: 2px;
    font-family: var(--jp-serif);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.15em;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all .2s;
  }
  .btn-primary {
    flex: 1;
    background: var(--gold);
    color: #0b0908;
    position: relative;
    overflow: hidden;
  }
  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 2px;
    border: 1px solid rgba(11, 9, 8, 0.2);
    pointer-events: none;
  }
  .btn-primary:active { background: var(--gold-bright); }
  .btn-primary:disabled {
    background: var(--surface-2);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .btn-primary:disabled::before { border-color: var(--hairline); }

  .btn-icon {
    width: 56px;
    background: transparent;

  // 1) https://supabase.com で新規プロジェクトを作成
  // 2) 下記 2 つを「Project Settings → API」から取得して貼り付け
  // 3) setup.sql を SQL Editor で実行

    const filename = `${Date.now()}_${Math.random().toString(36).slice(2,10)}.jpg`;
    const { error } = await sb.storage.from(STORAGE_BUCKET).upload(filename, blob, {

    const { data } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(filename);
    return data.publicUrl;
  }

  async function deletePhoto(publicUrl) {
    try {
      const marker = `/${STORAGE_BUCKET}/`;
      const idx = publicUrl.indexOf(marker);
      if (idx === -1) return;
      const path = publicUrl.slice(idx + marker.length);
      await sb.storage.from(STORAGE_BUCKET).remove([path]);
    } catch (e) { /* ignore */ }
  }

  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxSize = 800;
          let { width, height } = img;
          if (width > height) {
            if (width > maxSize) { height = height * (maxSize / width); width = maxSize; }
          } else {
            if (height > maxSize) { width = width * (maxSize / height); height = maxSize; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => {
            resolve({ blob, dataUrl: canvas.toDataURL('image/jpeg', 0.8) });
          }, 'image/jpeg', 0.8);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

    });
    el.querySelector('.qty-minus').addEventListener('click', (e) => {
      if (state.editMode) return;
      e.stopPropagation();
      updateQty(item.id, qty - 1);
    });
    el.querySelector('.qty-plus').addEventListener('click', (e) => {
      if (state.editMode) return;
      e.stopPropagation();
      updateQty(item.id, qty + 1);
    });
    return el;
  }

  function render() {
    const now = new Date();
    const d = ['SUN','MON','TUE','WED','THU','FRI','SAT'][now.getDay()];
    $('todayDate').textContent = `${now.getFullYear()}.${pad2(now.getMonth()+1)}.${pad2(now.getDate())}  ${d}`;

    const total = state.items.length;
    const checkedN = state.items.filter(i => i.checked).length;

    $('totalCount').innerHTML = `${pad2(total)}<span class="suffix">items</span>`;
    $('checkedCount').innerHTML = `${pad2(checkedN)}<span class="suffix">done</span>`;

    updateMemoButton();

    let items = state.items;
    if (state.selectedStoreId === 'none') items = items.filter(i => !i.store_id);
    else if (state.selectedStoreId !== 'all') items = items.filter(i => i.store_id === state.selectedStoreId);

    $('sectionLabel').textContent = 'Items';

    list.innerHTML = '';

    const grouped = state.selectedStoreId === 'all';

    // 空状態: カテゴリーが1つもない & 商品も0件のときのみ全画面空表示
    if (state.items.length === 0 && state.stores.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
        </div>
        <div class="empty-title">リストは空です</div>
        <div class="empty-ornament">◆ ◆ ◆</div>
        <div class="empty-sub">まずは「カテゴリー追加」から<br>カテゴリーを作ってください</div>
      `;
      list.appendChild(empty);
      return;
    }
    document.documentElement.classList.toggle('snap-scroll', grouped);
    if (grouped) {
      const buckets = new Map();
      state.stores.forEach(s => buckets.set(s.id, []));
      buckets.set('__none__', []);
      items.forEach(it => {
        const key = it.store_id || '__none__';
        if (!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(it);
      });
      state.stores.forEach(s => {
        const arr = buckets.get(s.id) || [];
        // 件数0でもセクション表示（追加ボタンを出すため）
        list.appendChild(renderStoreGroup(s.name, arr, s.id));
      });
      const noneArr = buckets.get('__none__') || [];
      if (noneArr.length > 0) list.appendChild(renderStoreGroup('未分類', noneArr, null));
    } else {
      const inner = document.createElement('div');
      inner.className = 'items';
      items.forEach(it => inner.appendChild(renderItemCard(it)));
      list.appendChild(inner);
      const sid = (state.selectedStoreId === 'none' || state.selectedStoreId === 'all')
        ? null : state.selectedStoreId;
      list.appendChild(makeAddItemBtn(sid));
    }
  }

  function makeAddItemBtn(storeId) {
    const btn = document.createElement('button');
    btn.className = 'add-item-btn';
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>商品を追加`;
    btn.addEventListener('click', () => openAddModal(storeId));
    return btn;
  }

  function renderStoreGroup(name, items, storeId) {
    const group = document.createElement('div');
    group.className = 'store-group';
    const head = document.createElement('div');
    head.className = 'store-group-head';
    head.innerHTML = `
      <div class="line"></div>
      <div class="name">${escapeHtml(name)}</div>
      <div class="count">${pad2(items.length)}</div>
      <div class="line"></div>
    `;
    const inner = document.createElement('div');
    inner.className = 'items';
    items.forEach(it => inner.appendChild(renderItemCard(it)));
    group.appendChild(head);
    group.appendChild(inner);
    group.appendChild(makeAddItemBtn(storeId));
    return group;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- Modal flow ----------
  function openAddModal(preStoreId) {
    state.editingId = null;
    state.tempPhoto = null;
    state.tempPhotoBlob = null;
    state.photoChanged = false;
    // Pre-select store: 明示引数 > 選択中カテゴリー
    if (preStoreId !== undefined) {
      state.editingStoreId = preStoreId;
    } else {
      state.editingStoreId = (state.selectedStoreId !== 'all' && state.selectedStoreId !== 'none')
        ? state.selectedStoreId : null;
    }
    $('itemModalEyebrow').textContent = 'New Item';
    $('itemModalTitle').textContent = '商品を追加';
    $('itemName').value = '';
    $('itemMeta').value = '';
    resetPhotoPreview();
    renderStoreSelector();
    $('deleteItem').style.display = 'none';
    $('itemModal').classList.add('open');
    setTimeout(() => $('itemName').focus(), 200);
  }

  function openEditModal(id) {
    const it = state.items.find(i => i.id === id);
    if (!it) return;
    state.editingId = id;
    state.editingStoreId = it.store_id || null;
    state.tempPhoto = it.photo || null;
    state.tempPhotoBlob = null;
    state.photoChanged = false;
    $('itemModalEyebrow').textContent = 'Edit Item';
    $('itemModalTitle').textContent = '商品を編集';
    $('itemName').value = it.name;
    $('itemMeta').value = it.meta || '';
    if (it.photo) {
      $('itemPhotoPreview').innerHTML = `<img src="${it.photo}" alt="">`;
      $('photoPickerText').textContent = '写真を変更';
    } else {
      resetPhotoPreview();
    }
    renderStoreSelector();
    $('deleteItem').style.display = '';
    $('itemModal').classList.add('open');
  }

  function resetPhotoPreview() {
    $('itemPhotoPreview').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
    $('photoPickerText').textContent = '写真を選択';
  }

  function closeItemModal() {
    $('itemModal').classList.remove('open');
    state.editingId = null;
    state.tempPhoto = null;
    state.tempPhotoBlob = null;
    state.photoChanged = false;
  }

  async function saveItem() {
    if (state.saving) return;
    const name = $('itemName').value.trim();
    const meta = $('itemMeta').value.trim();
    if (!name) { toast('商品名を入力してください'); return; }

    state.saving = true;
    $('saveItem').disabled = true;
    $('saveItem').textContent = '保存中...';

    let ok = false;
    if (state.editingId) {
      const it = state.items.find(i => i.id === state.editingId);
      const updates = { name, meta, store_id: state.editingStoreId || null };
      if (state.photoChanged && !state.tempPhotoBlob && !state.tempPhoto) {
        updates.photo = null;
        if (it && it.photo) deletePhoto(it.photo);
      }
      ok = await updateItem(
        state.editingId,
        updates,
        state.photoChanged ? state.tempPhotoBlob : null,
        state.photoChanged && it ? it.photo : null,
      );
    } else {
      ok = await createItem({
        name, meta,
        photoBlob: state.tempPhotoBlob,
        storeId: state.editingStoreId,
      });
    }

    state.saving = false;
    $('saveItem').disabled = false;
    $('saveItem').textContent = '保存する';

    if (ok) { closeItemModal(); await fetchItems(); }
  }

  async function deleteCurrent() {
    if (!state.editingId) return;
    if (!confirm('この商品を削除しますか？')) return;
    const it = state.items.find(i => i.id === state.editingId);
    const ok = await deleteItemRow(state.editingId, it && it.photo);
    if (ok) { closeItemModal(); await fetchItems(); }
  }

  async function handlePhotoSelect(file) {
    if (!file) return;
    $('photoPickerText').textContent = '圧縮中...';
    const { blob, dataUrl } = await compressImage(file);
    state.tempPhoto = dataUrl;
    state.tempPhotoBlob = blob;
    state.photoChanged = true;
    $('itemPhotoPreview').innerHTML = `<img src="${dataUrl}" alt="">`;
    $('photoPickerText').textContent = '写真を変更';
  }

  // ---------- Memo ----------
  function updateMemoButton() {
    const checkedN = state.items.filter(i => i.checked).length;
    const extrasN = state.extras.length;
    const totalN = checkedN + extrasN;
    const btn = $('memoBtn');
    btn.disabled = totalN === 0;
    btn.innerHTML = totalN > 0
      ? `<span>メモにまとめる</span><span class="btn-count">(${totalN})</span>`
      : '<span>メモにまとめる</span>';
  }

  function renderExtras() {
    const list = $('extrasList');
    const clearBtn = $('extrasClear');
    clearBtn.disabled = state.extras.length === 0;
    list.innerHTML = '';
    if (state.extras.length === 0) {
      list.innerHTML = `<div class="extras-empty">まだありません</div>`;
      return;
    }
    state.extras.forEach(ex => {
      const el = document.createElement('div');
      el.className = 'extra-item';
      el.innerHTML = `
        <div class="name">${escapeHtml(ex.name)}</div>
        <button class="remove" aria-label="削除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      `;
      el.querySelector('.remove').addEventListener('click', () => deleteExtra(ex.id));
      list.appendChild(el);
    });
  }

  function buildMemoText() {
    const checked = state.items.filter(i => i.checked);
    const extras = state.extras;
    const total = checked.length + extras.length;
    const now = new Date();
    const dateStr = `${now.getFullYear()}.${pad2(now.getMonth()+1)}.${pad2(now.getDate())}`;

    let body = '';
    let idx = 0;
    const sections = [];

    state.stores.forEach(s => {
      const its = checked.filter(it => it.store_id === s.id);
      if (its.length > 0) sections.push({ name: s.name, items: its });
    });
    const noneItems = checked.filter(it => !it.store_id);
    if (noneItems.length > 0) sections.push({ name: '未分類', items: noneItems });

    sections.forEach((sec, i) => {
      if (i > 0) body += '\n\n';
      body += `【${sec.name}】\n`;
      body += sec.items.map(it => {
        idx += 1;
        const q = it.qty || 1;
        const qtyPart = q > 1 ? ` × ${q}` : '';
        return `${pad2(idx)}.  ${it.name}${qtyPart}${it.meta ? '　（' + it.meta + '）' : ''}`;
      }).join('\n');
    });

    if (extras.length > 0) {
      if (body) body += '\n\n';
      body += '【追加の品物】\n';
      body += extras.map(ex => {
        idx += 1;
        return `${pad2(idx)}.  ${ex.name}`;
      }).join('\n');
    }
    if (!body) body = '（品目がまだありません）';

    return {
      total,
      text:
        `─ CAFE TOLAND ─\n` +
        `Shopping Memo\n` +
        `${dateStr}\n` +
        `────────────\n\n` +
        body +
        `\n\n────────────\n` +
        `合計  ${total}  品目`,
    };
  }

  function refreshMemoText() {
    const { total, text } = buildMemoText();
    $('memoText').textContent = text;
    $('memoCount').textContent = `${pad2(total)} items`;
  }

  async function openMemo() {
    const totalN = state.items.filter(i => i.checked).length + state.extras.length;
    if (totalN === 0) return;
    state.memoOpen = true;
    refreshMemoText();
    renderExtras();
    $('memoModal').classList.add('open');
    // ホーム画面にも反映されるよう保存
    const { text } = buildMemoText();
    await saveMemoToDb(text);
    // 選択していた商品のチェックと個数をリセット
    const checkedItems = state.items.filter(i => i.checked);
    if (checkedItems.length > 0) {
      const prev = checkedItems.map(it => ({ id: it.id, qty: it.qty }));
      checkedItems.forEach(it => { it.checked = false; it.qty = 1; });
      render();
      const { error } = await sb
        .from('shopping_items')
        .update({ checked: false, qty: 1 })
        .in('id', checkedItems.map(it => it.id));
      if (error) {
        prev.forEach(p => {
          const it = state.items.find(i => i.id === p.id);
          if (it) { it.checked = true; it.qty = p.qty; }
        });
        render();
        toast('リセットエラー');
      }
    }
  }

  function closeMemo() {
    state.memoOpen = false;
    $('memoModal').classList.remove('open');
  }

  async function submitExtra() {
    const input = $('extrasInput');
    const name = input.value.trim();
    if (!name) return;
    input.value = '';
    await addExtra(name);
  }

  async function copyMemo() {
    const text = $('memoText').textContent;
    try {
      await navigator.clipboard.writeText(text);
      const btn = $('copyMemo');
      btn.classList.add('copied');
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>COPIED';
      toast('メモをコピーしました');
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="1"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>COPY';
      }, 2000);
    } catch (e) { toast('コピーに失敗しました'); }
  }

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- Init ----------
  async function init() {
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      showSetup();
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Events
    $('memoBtn').addEventListener('click', openMemo);
    $('cancelItem').addEventListener('click', closeItemModal);
    $('saveItem').addEventListener('click', saveItem);
    $('deleteItem').addEventListener('click', deleteCurrent);
    $('closeMemo').addEventListener('click', closeMemo);
    $('copyMemo').addEventListener('click', copyMemo);
    $('itemPhotoInput').addEventListener('change', (e) => handlePhotoSelect(e.target.files[0]));
    $('extrasAddBtn').addEventListener('click', submitExtra);
    $('extrasInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitExtra(); } });
    $('extrasClear').addEventListener('click', clearAllExtras);
    $('storeAddBtn').addEventListener('click', submitNewStore);
    $('storeNameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitNewStore(); } });
    $('closeStoreModal').addEventListener('click', closeStoreModal);
    $('savedMemoCopy').addEventListener('click', copySavedMemo);
    $('savedMemoDelete').addEventListener('click', deleteSavedMemo);
    [$('itemModal'), $('memoModal'), $('storeModal')].forEach(m => {
      m.addEventListener('click', (e) => {
        if (e.target === m) {
          if (m.id === 'memoModal') closeMemo();
          else if (m.id === 'storeModal') closeStoreModal();
          else m.classList.remove('open');
        }
      });
    });
    window.addEventListener('focus', () => { fetchItems(); fetchExtras(); fetchStores(); fetchSavedMemo(); });

    // Initial load with loader
    list.innerHTML = '<div class="loader"><div class="spinner"></div>LOADING</div>';
    await Promise.all([fetchStores(), fetchItems(), fetchExtras(), fetchSavedMemo()]);

    // Realtime subscription
    sb.channel('shopping_items_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'shopping_items' }, () => {
        fetchItems();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'memo_extras' }, () => {
        fetchExtras();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'stores' }, () => {
        fetchStores();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'saved_memo' }, () => {
        fetchSavedMemo();
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') setSync('synced');
      });
  }

  init();
</script>
</body>
</html>
